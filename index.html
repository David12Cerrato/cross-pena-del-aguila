<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="theme-color" content="#111827">

    <title>Cross Peña del Águila</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="cabecera">

            <img src="logo.png" class="logo" alt="Cross Peña del Águila">

            <h1>Cross Peña del Águila</h1>

            <p class="subtitulo">
                Consulta de dorsales
            </p>

        </header>


        <section class="buscador">

            <label for="dorsal">
                NÚMERO DE DORSAL
            </label>

            <input
                id="dorsal"
                type="number"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="000"
                oninput="buscar()"
                autocomplete="off"
                autofocus>

        </section>


        <section id="resultado" class="resultado oculto">

            <div class="tarjeta">

                <div class="estado">
                    <span>●</span>
                    <span id="estadoTexto">DORSAL ENCONTRADO</span>
                </div>

                <div class="dorsal-mostrado">
                    <span>DORSAL</span>
                    <strong id="dorsalMostrado"></strong>
                </div>

                <h2 id="nombre"></h2>

                <p id="club"></p>

                <p id="localidad"></p>

                <button
    class="nueva-busqueda"
    onclick="nuevaBusqueda()">
    🔄 Nueva búsqueda
</button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
