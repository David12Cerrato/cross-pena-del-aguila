<!DOCTYPE html>
<html lang="es">
<head>
    <head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="theme-color" content="#111827">

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon"
          href="assets/apple-touch-icon.png">

    <title>Cross Peña del Águila</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="cronometro">

    <div class="cronometro-titulo">
        🏁 TIEMPO DE CARRERA
    </div>

    <div id="tiempo">
        00:00:00
    </div>

    <div class="cronometro-botones">

        <button id="iniciar">
            ▶️ Iniciar
        </button>

        <button id="pausar">
            ⏸️ Pausar
        </button>

        <button id="reiniciar">
            🔄 Reiniciar
        </button>

    </div>

</div>


        <header class="cabecera">

            <img src="assets/icon-192.png" class="logo" alt="Cross Peña del Águila">

            <h1>Cross Peña del Águila</h1>

            <p class="subtitulo">
                Consulta de dorsales
            </p>

        </header>


        <section class="buscador">

            <label for="dorsal">
                NÚMERO DE DORSAL
            </label>

            <input
                id="dorsal"
                type="number"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="000"
                oninput="buscar()"
                onchange="guardarDorsalActual()"
                autocomplete="off"
                autofocus>

        </section>
<section class="historial">

    <div class="historial-cabecera">
        <h3>ÚLTIMOS DORSALES CONSULTADOS</h3>

        <button
            type="button"
            class="borrar-historial"
            onclick="borrarHistorial()">
            🗑️ Borrar historial
        </button>
    </div>

    <div id="historialDorsales"></div>

</section>

        <section id="resultado" class="resultado oculto">

            <div class="tarjeta">

                <div class="estado">
                    <span>●</span>
                    <span id="estadoTexto">DORSAL ENCONTRADO</span>
                </div>

                <div class="dorsal-mostrado">
                    <span>DORSAL</span>
                    <strong id="dorsalMostrado"></strong>
                </div>

                <h2 id="nombre"></h2>

                <p id="club"></p>

                <p id="localidad"></p>

                <button
    class="nueva-busqueda"
    onclick="nuevaBusqueda()">
    🔄 Nueva búsqueda
</button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
