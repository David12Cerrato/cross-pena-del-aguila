<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross Peña del Águila</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="contenedor">

    <img src="logo.png" class="logo" alt="Logo">

    <h1>Cross Peña del Águila</h1>

    <input
        id="dorsal"
        type="number"
        placeholder="Introduce el dorsal"
        oninput="buscar()"
        autofocus>

    <div id="resultado" class="oculto">

        <div class="tarjeta">

            <h2 id="nombre"></h2>

            <p id="club"></p>

            <p id="localidad"></p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
